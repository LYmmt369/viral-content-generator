[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viral-content-generator"
version = "4.1.1"
description = "材料成稿与精准改稿：保护原句、保留未改内容、记录差异并准确撤回"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    {name = "Sunnyeung", email = "Sunnyeung369@users.noreply.github.com"}
]
keywords = [
    "content-creation",
    "viral-content",
    "writing-assistant",
    "precise-editing",
    "ai-content",
    "chinese-writing",
    "source-based-writing",
    "reversible-edits"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing",
    "Topic :: Utilities",
    "Natural Language :: Chinese",
]

dependencies = [
    "openai>=1.50.0",
    "anthropic>=0.40.0",
    "google-generativeai>=0.8.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/LYmmt369/viral-content-generator"
Documentation = "https://github.com/LYmmt369/viral-content-generator#readme"
Repository = "https://github.com/LYmmt369/viral-content-generator.git"
Issues = "https://github.com/LYmmt369/viral-content-generator/issues"

[project.scripts]
viral-content = "viral_content_cli:main"
viral-content-v4 = "viral_content_cli:main"
viral-revise = "viral_content_revision:main"

[tool.setuptools]
include-package-data = true
py-modules = ["viral_content_cli", "viral_content_revision", "viral_content_drafting", "viral_article_cli"]

[tool.setuptools.package-data]
viral_content = ["resources/**/*"]

[tool.setuptools.packages.find]
where = ["."]
include = ["viral_content*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
