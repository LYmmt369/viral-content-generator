name: Release package

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v4.1.6"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"tag {os.environ['RELEASE_TAG']} does not match package {expected}")
          PY
      - run: python -m pip install --upgrade pip build ".[dev]"
      - name: Run release checks
        run: |
          python -m pytest -q
          python scripts/check_docs.py
          python scripts/check_secrets.py
      - run: python -m build --wheel
      - name: Verify built wheel outside source tree
        run: |
          python -m pip install dist/*.whl --target .wheel-check --no-deps
          python -I scripts/check_installed.py .wheel-check
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*.whl
          generate_release_notes: true
